name: Probe radio page (temporär)
on:
  push:
    branches: [probe-radio]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch dashboard and scripts
        run: |
          mkdir -p probe/out
          UA="Mozilla/5.0 (probe for listener tool)"
          curl -sSL -A "$UA" -o probe/out/radio.html -w "radio %{http_code} %{size_download}\n" https://andonlabs.com/radio | tee probe/out/status.txt
          grep -oE '(src|href)="[^"]+\.js"' probe/out/radio.html | sed -E 's/.*="([^"]+)"/\1/' | sort -u > probe/out/scripts.txt || true
          grep -oE '"/_app/immutable/[^"]+\.js"' probe/out/radio.html | tr -d '"' | sort -u >> probe/out/scripts.txt || true
          sort -u -o probe/out/scripts.txt probe/out/scripts.txt
          i=0
          for s in $(cat probe/out/scripts.txt); do
            u="$s"; case "$u" in http*) ;; *) u="https://andonlabs.com$s";; esac
            i=$((i+1)); curl -sSL -A "$UA" -o "probe/out/js_$i.js" "$u" || true
          done
          # Nachgeladene Chunks: einmal eine Ebene tiefer
          grep -ohE '\./[A-Za-z0-9_.-]+\.js|/_app/immutable/[A-Za-z0-9_./-]+\.js' probe/out/js_*.js 2>/dev/null | sort -u | head -150 > probe/out/chunks.txt || true
          j=0
          for c in $(cat probe/out/chunks.txt); do
            case "$c" in ./*) u="https://andonlabs.com/_app/immutable/chunks/${c#./}";; *) u="https://andonlabs.com$c";; esac
            j=$((j+1)); curl -sSL -A "$UA" -o "probe/out/chunk_$j.js" "$u" || true
          done
          grep -ohE "https?://[A-Za-z0-9._/-]*(api|live365|radio|station|stream|now|track|play|ws)[A-Za-z0-9._/?=&{}$-]*|['\"\`]/api/[A-Za-z0-9_/{}$.-]*" probe/out/*.html probe/out/*.js 2>/dev/null | sort -u > probe/out/endpoints.txt || true
          grep -oiE "live365[^\"' ]{0,80}" probe/out/* 2>/dev/null | sort -u | head -50 > probe/out/live365.txt || true
          grep -oiE "(now.?playing|currentTrack|nowPlaying|schedule)[^\"' ]{0,60}" probe/out/*.html | sort -u | head -50 > probe/out/html_hints.txt || true
          ls -la probe/out | head -20
      - name: Save
        run: |
          rm -f probe/out/js_*.js probe/out/chunk_*.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe results" && git push
