name: Probe radio page (temporär)
on:
  push:
    branches: [probe-radio]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Full Live365 JSON
        run: |
          mkdir -p probe/np2
          curl -sSL -m 20 -o probe/np2/station.json https://api.live365.com/station/a46431
          sleep 240
          curl -sSL -m 20 -o probe/np2/station_later.json https://api.live365.com/station/a46431
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/np2 && git commit -m "Probe results 3" && git push
