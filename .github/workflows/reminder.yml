name: Schedule reminder

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # alle 15 Min. (GitHub lässt viele Läufe aus); das Skript verschickt nur, wenn ein Block fällig ist, und nie doppelt
  workflow_dispatch:       # manuell starten
    inputs:
      block:
        description: "Block (auto = nächster Block, oder 1 / 2 / 3)"
        default: "auto"
      mode:
        description: "schedule = wie zeitgesteuert (nur wenn fällig, nie doppelt) – für den externen Weckdienst; leer lassen bei manuellem Start"
        default: ""

permissions:
  contents: write

concurrency:
  group: reminder

jobs:
  send-mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Send reminder mail
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CLOSING: ${{ secrets.MAIL_CLOSING }}
          BLOCK: ${{ github.event.inputs.block || 'auto' }}
          MODE: ${{ github.event.inputs.mode || github.event_name }}
        run: python3 scripts/send_reminder.py
      - name: Save state and next-post.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state next-post.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nichts zu speichern."; exit 0; fi
          git commit -m "Reminder sent: update state and next-post.txt"
          git pull --rebase && git push
